[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-strategy-runtime"
version = "1.0.0"
description = "Auditable paper strategy runtime contract for SX-CH-003"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
psrc = "psrc.cli:main"

[tool.setuptools.packages.find]
include = ["psrc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["psrc"]
omit = ["psrc/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
